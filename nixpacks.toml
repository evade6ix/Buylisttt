[variables]
NODE_ENV = "production"

[phases.setup]
# Install Node via Nix
nixPkgs = ["nodejs"]

[phases.install]
# Install deps for server and client
cmds = [
  "cd server && npm install",
  "cd client && npm install"
]

[phases.build]
# Build the React client
cmds = [
  "cd client && npm run build"
]

[start]
# Start the Express server (which serves the built client)
cmd = "cd server && node index.js"
